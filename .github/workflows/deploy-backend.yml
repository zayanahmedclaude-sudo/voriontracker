name: Deploy Backend to VPS

on:
  push:
    branches:
      - zayan-work

permissions:
  contents: read

concurrency:
  group: vorion-backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to production VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Configure restricted SSH access
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/vorion_deploy"

          chmod 600 "$HOME/.ssh/vorion_deploy"

          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy verified commit
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "Invalid VPS SSH port."
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/vorion_deploy" \
            -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "deploy $GITHUB_SHA"
